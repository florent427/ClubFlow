name: release-please

on:
  push:
    branches: [main]
  # Rattrapage manuel, indispensable et pas seulement confortable.
  #
  # La PR de release est auto-mergée avec le `GITHUB_TOKEN`, et GitHub ne
  # redéclenche AUCUN workflow sur un push signé de ce token — protection
  # anti-boucle. release-please ne repasse donc pas sur son propre merge, et
  # le tag n'est coupé qu'au merge SUIVANT. Sans ce trigger, impossible de
  # rattraper autrement qu'en poussant un commit bidon.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Statut `ci-ok` posé sur la tête de la PR de release (cf. plus bas).
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # AUTO-MERGE de la PR de release dès qu'elle est ouverte (squash, sans review).
      # → tag git + GitHub Release créés automatiquement → deploy.yml déclenché.
      # Note : on passe le JSON via env pour éviter les soucis de quoting (la
      # body de la PR contient des parenthèses, apostrophes, etc.)
      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')

          # main exige le check `ci-ok` (ruleset .github/rulesets/main-ci-ok.json).
          # Ouverte par GITHUB_TOKEN, cette PR ne déclenche aucun workflow, donc
          # personne d'autre ne posera ce check : on pose le statut ici. Le
          # commit de release ne touche que CHANGELOG.md et le manifeste,
          # rien que `ci.yml` vérifierait. La tête est relue juste avant, et
          # `sha` au merge refuse la fusion si la branche a bougé entre-temps.
          echo "Statut ci-ok sur $HEAD_SHA (PR #$PR_NUMBER)"
          gh api -X POST "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=ci-ok \
            -f description="PR de release : CHANGELOG et manifeste seulement" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "Auto-merging release PR #$PR_NUMBER"
          gh api -X PUT "repos/${{ github.repository }}/pulls/$PR_NUMBER/merge" \
            -F merge_method=squash \
            -f sha="$HEAD_SHA"
